version: 2.1

orbs:
  github-cli: circleci/github-cli@2.2.0

jobs:
  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout

      - github-cli/setup:
          app-id: GH_APP_ID
          app-installation-id: GH_APP_INSTALLATION_ID
          app-private-key: GH_APP_PRIVATE_KEY

      - run:
          name: Set deployment name
          command: |
            PR_JSON=$(gh api "repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/commits/${COMMIT_HASH}/pulls" \
               --jq '.[]
                      | select(.base.ref == "master")
                      | {
                          number,
                          url: .html_url,
                        }')

            echo $PR_JSON

            PR_NUMBER=$(echo $PR_JSON | jq -r '.number')
            PR_URL=$(echo $PR_JSON | jq -r '.url')

            echo "export VERSION=production-$(date +%Y.%m.%d)-${PR_NUMBER}" >> $BASH_ENV
            echo "export PR_URL=${PR_URL}" >> $BASH_ENV

      - run:
          name: Do something
          command: echo $CIRCLE_SHA1

      - run:
          name: Create GitHub tag
          command: |
            git config user.email "ci@example.com"
            git config user.name "CircleCI"
            git tag -a "$VERSION" -m "CI: ${CIRCLE_BUILD_URL}\nTriggerd by: ${CIRCLE_USERNAME}\nPR:${PR_URL}"
            git push origin "$VERSION"

      - run:
          name: Create GitHub release
          command: |
            gh release create "${VERSION}" \
              --verify-tag \
              --title "${VERSION}" \
              --generate-notes

workflows:
  deploy-workflow:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - master
