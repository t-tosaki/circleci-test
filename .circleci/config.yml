version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Say hello
          command: echo Hello, World!
      - run:
          name: Log deployment
          command: |
            circleci run release log \
              --environment-name=production \
              --component-name=circleci-test \
              --target-version=$CIRCLE_SHA1

workflows:
  deploy:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - master
